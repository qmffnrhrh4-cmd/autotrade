<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분할 주문 관리 - AutoTrade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4A90E2;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --dark-bg: #1a1a2e;
            --card-bg: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #0f3460 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
        }

        .page-header {
            background: linear-gradient(135deg, var(--card-bg) 0%, #1e3a5f 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .page-header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-header .subtitle {
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 1rem;
        }

        .stats-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .stat-item .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .order-group-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .order-group-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(74, 144, 226, 0.3);
        }

        .order-group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .order-type-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .order-type-buy {
            background: rgba(40, 167, 69, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .order-type-sell {
            background: rgba(220, 53, 69, 0.2);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        .stock-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stock-name {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .stock-code {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .progress-section {
            margin: 20px 0;
        }

        .progress {
            height: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--primary-color) 0%, #00d4ff 100%);
            border-radius: 10px;
        }

        .entries-table {
            width: 100%;
            margin-top: 15px;
        }

        .entries-table th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .entries-table td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: var(--warning-color);
        }

        .status-partial {
            background: rgba(0, 123, 255, 0.2);
            color: #007bff;
        }

        .status-filled {
            background: rgba(40, 167, 69, 0.2);
            color: var(--success-color);
        }

        .status-cancelled {
            background: rgba(108, 117, 125, 0.2);
            color: #6c757d;
        }

        .btn-cancel-group {
            background: linear-gradient(135deg, var(--danger-color) 0%, #c82333 100%);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-cancel-group:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
        }

        .btn-refresh {
            background: linear-gradient(135deg, var(--primary-color) 0%, #357abd 100%);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 24px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .tab-btn:hover:not(.active) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <h1>
                <i class="bi bi-list-columns"></i>
                분할 주문 관리
            </h1>
            <div class="subtitle">
                동적 분할 주문의 미체결 내역을 확인하고 관리하세요
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stats-card">
                <div class="stat-item">
                    <div class="label">활성 그룹</div>
                    <div class="value" id="activeCount">-</div>
                </div>
            </div>
            <div class="stats-card">
                <div class="stat-item">
                    <div class="label">미체결 주문</div>
                    <div class="value" id="pendingCount" style="color: var(--warning-color)">-</div>
                </div>
            </div>
            <div class="stats-card">
                <div class="stat-item">
                    <div class="label">완료된 그룹</div>
                    <div class="value" id="completedCount" style="color: var(--success-color)">-</div>
                </div>
            </div>
            <div class="stats-card">
                <div class="stat-item">
                    <button class="btn btn-refresh" onclick="loadActiveOrders()">
                        <i class="bi bi-arrow-clockwise"></i> 새로고침
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab Buttons -->
        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="active" onclick="switchTab('active')">
                활성 주문
            </button>
            <button class="tab-btn" data-tab="completed" onclick="switchTab('completed')">
                완료된 주문
            </button>
        </div>

        <!-- Active Orders Container -->
        <div id="activeOrdersContainer" class="tab-content active">
            <div id="activeOrdersList"></div>
        </div>

        <!-- Completed Orders Container -->
        <div id="completedOrdersContainer" class="tab-content" style="display: none;">
            <div id="completedOrdersList"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentTab = 'active';
        let autoRefreshInterval = null;

        // Tab switching
        function switchTab(tab) {
            currentTab = tab;

            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            // Show/hide content
            document.getElementById('activeOrdersContainer').style.display = tab === 'active' ? 'block' : 'none';
            document.getElementById('completedOrdersContainer').style.display = tab === 'completed' ? 'block' : 'none';

            // Load data
            if (tab === 'active') {
                loadActiveOrders();
            } else {
                loadCompletedOrders();
            }
        }

        // Load active orders
        async function loadActiveOrders() {
            try {
                const response = await fetch('/api/split_orders/active');
                const data = await response.json();

                if (data.success) {
                    displayActiveOrders(data.active_groups);
                    updateStats(data);
                } else {
                    showToast('오류', '활성 주문을 불러오는데 실패했습니다', 'danger');
                }
            } catch (error) {
                console.error('Failed to load active orders:', error);
                showToast('오류', '네트워크 오류가 발생했습니다', 'danger');
            }
        }

        // Load completed orders
        async function loadCompletedOrders() {
            try {
                const response = await fetch('/api/split_orders/completed?limit=50');
                const data = await response.json();

                if (data.success) {
                    displayCompletedOrders(data.completed_groups);
                    document.getElementById('completedCount').textContent = data.total_count;
                } else {
                    showToast('오류', '완료된 주문을 불러오는데 실패했습니다', 'danger');
                }
            } catch (error) {
                console.error('Failed to load completed orders:', error);
                showToast('오류', '네트워크 오류가 발생했습니다', 'danger');
            }
        }

        // Display active orders
        function displayActiveOrders(groups) {
            const container = document.getElementById('activeOrdersList');

            if (!groups || groups.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <h3>활성 주문 없음</h3>
                        <p>현재 진행 중인 분할 주문이 없습니다</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = groups.map(group => `
                <div class="order-group-card">
                    <div class="order-group-header">
                        <div class="stock-info">
                            <span class="order-type-badge order-type-${group.split_type}">
                                ${group.split_type === 'buy' ? '매수' : '매도'}
                            </span>
                            <div>
                                <div class="stock-name">${group.stock_name}</div>
                                <div class="stock-code">${group.stock_code}</div>
                            </div>
                        </div>
                        <div>
                            ${group.completion_ratio < 1 ? `
                                <button class="btn btn-cancel-group" onclick="cancelGroup('${group.group_id}')">
                                    <i class="bi bi-x-circle"></i> 취소
                                </button>
                            ` : ''}
                        </div>
                    </div>

                    <div class="progress-section">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span>진행률: ${(group.completion_ratio * 100).toFixed(1)}%</span>
                            <span>${group.filled_quantity} / ${group.total_quantity}주</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" style="width: ${group.completion_ratio * 100}%"></div>
                        </div>
                        ${group.average_price > 0 ? `
                            <div style="margin-top: 8px; color: var(--text-secondary);">
                                평균 체결가: ${group.average_price.toLocaleString()}원
                            </div>
                        ` : ''}
                    </div>

                    <table class="entries-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>주문번호</th>
                                <th>수량</th>
                                <th>가격</th>
                                <th>체결수량</th>
                                <th>체결가</th>
                                <th>상태</th>
                                <th>체결률</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${group.entries.map((entry, idx) => `
                                <tr>
                                    <td>${idx + 1}</td>
                                    <td><code>${entry.order_number || '-'}</code></td>
                                    <td>${entry.quantity.toLocaleString()}</td>
                                    <td>${entry.price.toLocaleString()}원</td>
                                    <td>${entry.filled_quantity.toLocaleString()}</td>
                                    <td>${entry.filled_price > 0 ? entry.filled_price.toLocaleString() + '원' : '-'}</td>
                                    <td>
                                        <span class="status-badge status-${entry.status}">
                                            ${getStatusLabel(entry.status)}
                                        </span>
                                    </td>
                                    <td>${(entry.fill_ratio * 100).toFixed(0)}%</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div style="margin-top: 15px; font-size: 0.85rem; color: var(--text-secondary);">
                        <i class="bi bi-clock"></i> 생성: ${new Date(group.created_at).toLocaleString('ko-KR')}
                    </div>
                </div>
            `).join('');
        }

        // Display completed orders
        function displayCompletedOrders(groups) {
            const container = document.getElementById('completedOrdersList');

            if (!groups || groups.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-check-circle"></i>
                        <h3>완료된 주문 없음</h3>
                        <p>아직 완료된 분할 주문이 없습니다</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = groups.map(group => `
                <div class="order-group-card">
                    <div class="order-group-header">
                        <div class="stock-info">
                            <span class="order-type-badge order-type-${group.split_type}">
                                ${group.split_type === 'buy' ? '매수' : '매도'}
                            </span>
                            <div>
                                <div class="stock-name">${group.stock_name}</div>
                                <div class="stock-code">${group.stock_code}</div>
                            </div>
                        </div>
                        <div>
                            <span class="status-badge status-filled">
                                <i class="bi bi-check-circle"></i> 완료
                            </span>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 15px 0;">
                        <div>
                            <div style="color: var(--text-secondary); font-size: 0.85rem;">총 수량</div>
                            <div style="font-size: 1.2rem; font-weight: 600;">${group.total_quantity.toLocaleString()}주</div>
                        </div>
                        <div>
                            <div style="color: var(--text-secondary); font-size: 0.85rem;">평균 체결가</div>
                            <div style="font-size: 1.2rem; font-weight: 600;">${group.average_price.toLocaleString()}원</div>
                        </div>
                        <div>
                            <div style="color: var(--text-secondary); font-size: 0.85rem;">분할 횟수</div>
                            <div style="font-size: 1.2rem; font-weight: 600;">${group.entries_count}회</div>
                        </div>
                    </div>

                    <div style="margin-top: 15px; font-size: 0.85rem; color: var(--text-secondary); display: flex; justify-content: space-between;">
                        <span><i class="bi bi-clock"></i> 생성: ${new Date(group.created_at).toLocaleString('ko-KR')}</span>
                        <span><i class="bi bi-check-circle"></i> 완료: ${new Date(group.completed_at).toLocaleString('ko-KR')}</span>
                    </div>
                </div>
            `).join('');
        }

        // Cancel group
        async function cancelGroup(groupId) {
            if (!confirm('이 분할 주문 그룹의 모든 미체결 주문을 취소하시겠습니까?')) {
                return;
            }

            try {
                const response = await fetch(`/api/split_orders/${groupId}/cancel`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    showToast('성공', data.message, 'success');
                    loadActiveOrders(); // Reload
                } else {
                    showToast('오류', data.message || '취소에 실패했습니다', 'danger');
                }
            } catch (error) {
                console.error('Failed to cancel group:', error);
                showToast('오류', '네트워크 오류가 발생했습니다', 'danger');
            }
        }

        // Update stats
        function updateStats(data) {
            document.getElementById('activeCount').textContent = data.total_count;

            // Count pending orders
            let pendingCount = 0;
            data.active_groups.forEach(group => {
                group.entries.forEach(entry => {
                    if (entry.status === 'pending' || entry.status === 'partial') {
                        pendingCount++;
                    }
                });
            });
            document.getElementById('pendingCount').textContent = pendingCount;
        }

        // Get status label
        function getStatusLabel(status) {
            const labels = {
                'pending': '대기',
                'partial': '부분체결',
                'filled': '체결완료',
                'cancelled': '취소됨'
            };
            return labels[status] || status;
        }

        // Show toast notification
        function showToast(title, message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `alert alert-${type} alert-dismissible fade show`;
            toast.innerHTML = `
                <strong>${title}</strong> ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.querySelector('.toast-container').appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 5000);
        }

        // Auto refresh every 10 seconds
        function startAutoRefresh() {
            autoRefreshInterval = setInterval(() => {
                if (currentTab === 'active') {
                    loadActiveOrders();
                }
            }, 10000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadActiveOrders();
            loadCompletedOrders();
            startAutoRefresh();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
